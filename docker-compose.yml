services:
  # -------------------------------------------------------------
  # 1. Cơ sở dữ liệu PostgreSQL 16
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ticketverse-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d passve_v2"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticketverse-network

  # -------------------------------------------------------------
  # 2. Bộ nhớ đệm & Khóa giữ chỗ Redis 7
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ticketverse-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticketverse-network

  # -------------------------------------------------------------
  # 3. Máy chủ Backend NestJS
  # -------------------------------------------------------------
  backend:
    container_name: ticketverse-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "7000:7000"
    env_file:
      - .env.docker
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ticketverse-network

# -------------------------------------------------------------
# Phân vùng lưu trữ bền vững (Volumes) & Mạng nội bộ (Networks)
# -------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  ticketverse-network:
    driver: bridge
