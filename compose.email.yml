services:
  email-redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${EMAIL_REDIS_PORT:-6380}:6379'
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - email-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  email-redis-data:
