name: ticketverse-backend-production

services:
  # -------------------------------------------------------------
  # 1. C? s? d? li?u PostgreSQL 16 (Deploy th?c t?)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ticketverse-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: passve_v2
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d passve_v2"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prod-network

  # -------------------------------------------------------------
  # 2. B? nh? ??m & Kh?a gi? ch? Redis 7 (Deploy th?c t?)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ticketverse-redis-prod
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prod-network

  # -------------------------------------------------------------
  # 3. M?y ch? Backend NestJS 11 (C?u h?nh ch?y th?c t? ho?n ch?nh)
  # -------------------------------------------------------------
  backend:
    container_name: ticketverse-backend-prod
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    ports:
      - "7000:7000"
    environment:
      NODE_ENV: development
      PORT: 7000
      FRONTEND_URL: http://localhost:3000,http://localhost:5173
      RATE_LIMIT_MAX: 120
      UPLOAD_DIR: uploads
      UPLOAD_MAX_FILE_SIZE_MB: 10

      # Database PostgreSQL th?c t?
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: passve_v2
      DB_USERNAME: myuser
      DB_PASSWORD: mypassword
      DB_SYNCHRONIZE: "false"

      # Redis th?c t?
      SECURITY_REDIS_URL: redis://redis:6379/1
      SECURITY_REDIS_PREFIX: ticketverse-security

      # Chu?i kh?a b?o m?t JWT & QR
      JWT_ACCESS_SECRET: ticketverse_jwt_access_super_secret_key_production_2026
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_SECRET: ticketverse_jwt_refresh_super_secret_key_production_2026
      JWT_REFRESH_EXPIRES: 7d
      TICKET_QR_SECRET: 0a554bbca7060d6ff52a59886d63e2fba3b03735041a89dfcc8cff8c87abd903

      # G?i email v? ?i?n t? th?c t? qua Gmail SMTP
      TICKET_EMAIL_ENABLED: "true"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_USER: 23050150@student.bdu.edu.vn
      SMTP_PASS: guswenxaxwjbhlzn
      SMTP_FROM: 23050150@student.bdu.edu.vn

      # C?ng thanh to?n VNPay Sandbox th?c t?
      PAYMENT_PROVIDER: VNPAY
      VNPAY_TMN_CODE: W6226CVC
      VNPAY_HASH_SECRET: SNCSKZWRALELCJWBLVYXFKGTDXRFJPXW
      VNPAY_QUERY_IP: 127.0.0.1
      VNPAY_RETURN_URL: http://localhost:7000/api/v1/payments/vnpay/return
      VNPAY_FRONTEND_URL: http://localhost:3000

      # Worker ??i so?t chuy?n nh??ng v?
      RESALE_SETTLEMENT_WORKER_ENABLED: "true"
    volumes:
      - backend_prod_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prod-network

# -------------------------------------------------------------
# Ph?n v?ng l?u tr? & M?ng n?i b?
# -------------------------------------------------------------
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  backend_prod_uploads:
    driver: local

networks:
  prod-network:
    driver: bridge
