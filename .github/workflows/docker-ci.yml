name: Backend Docker CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên web GitHub

jobs:
  docker-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Kéo mã nguồn mới nhất về
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Thiết lập Docker Buildx để tăng tốc build image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Khởi chạy toàn bộ hệ thống bằng docker-compose trong thư mục cicd
      - name: Build and Start Services with Docker Compose
        run: |
          docker compose -f cicd/docker-compose.yml up -d --build

      # 4. Chờ kiểm tra trạng thái sức khỏe (Healthcheck) của các container
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL, Redis, and NestJS Backend to be ready..."
          sleep 15
          docker compose -f cicd/docker-compose.yml ps

      # 5. Chạy lệnh nạp dữ liệu danh mục mẫu (Seed Data)
      - name: Run Database Seeds
        run: |
          docker compose -f cicd/docker-compose.yml exec -T backend npm run seed:categories -- --apply

      # 6. Kiểm tra API Backend phản hồi thành công
      - name: Verify Backend API Response
        run: |
          echo "Testing Backend API endpoint..."
          curl --retry 5 --retry-delay 3 --retry-connrefused -f http://localhost:7000/api || exit 1
          echo "Backend API is up and running successfully!"

      # 7. In logs nếu có lỗi phát sinh để dễ kiểm tra
      - name: Show Container Logs
        if: always()
        run: |
          docker compose -f cicd/docker-compose.yml logs --tail=100

      # 8. Dọn dẹp tài nguyên sau khi kiểm tra xong
      - name: Cleanup Docker containers
        if: always()
        run: |
          docker compose -f cicd/docker-compose.yml down -v
