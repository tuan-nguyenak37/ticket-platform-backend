name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketverse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ticketverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketverse -d ticketverse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: ticketverse
      DB_PASSWORD: ci-only-password
      DB_NAME: ticketverse_test
      RUN_DATABASE_TESTS: 'true'
      JWT_ACCESS_SECRET: ci-only-key-not-a-real-deployment-secret
      JWT_REFRESH_SECRET: different-ci-only-key-not-a-deployment-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run build
